runtimeId: codex
supportedAssetKinds:
  - skill
  - plugin
  - mcp
enabledCapabilities:
  - plugin.policy.disable-build-web-apps
  - plugin.policy.disable-superpowers
bindingPolicy:
  defaults:
    skill:
      - user-dir
      - cache
    mcp:
      - remote-http
      - stdio-command
    plugin:
      - package
      - external
      - marketplace
  overrides: {}
nativeFiles:
  - name: config
    template: ${HOME}/.codex/config.toml
  - name: globalAgents
    template: ${HOME}/.codex/AGENTS.md
  - name: userSkillsDir
    template: ${HOME}/.agents/skills
cacheBindings:
  - name: skillsDir
    template: ${CACHE_ROOT}/skills
  - name: packagesDir
    template: ${CACHE_ROOT}/packages
  - name: manifestsDir
    template: ${CACHE_ROOT}/manifests
mergeStrategy: codex-toml
ownedStateFile: ${HOME}/.config/agent-governance/state/${MACHINE_ID}/codex.json
profileMode: managed
notes:
  - policies/codex/global-AGENTS.md is the versioned source for ~/.codex/AGENTS.md.
  - Only global governed skills sync into ~/.agents/skills; project-scoped skills use project config paths into the independent governance cache.
  - ~/.codex/skills is reserved for Codex-managed system skills; no user-skill mirror is generated there.
  - Governed plugin and MCP entries are merged into ~/.codex/config.toml.
  - Non-governed model and reasoning settings remain untouched.

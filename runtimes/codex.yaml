runtimeId: codex
supportedAssetKinds:
  - skill
  - plugin
  - mcp
enabledCapabilities:
  - plugin.openai-curated.build-web-apps
  - plugin.openai-curated.superpowers
bindingPolicy:
  defaults:
    skill:
      - cache
    mcp:
      - remote-http
      - stdio-command
    plugin:
      - package
      - external
      - marketplace
  overrides: {}
nativeFiles:
  - name: config
    template: ${HOME}/.codex/config.toml
cacheBindings:
  - name: skillsDir
    template: ${CACHE_ROOT}/skills
  - name: packagesDir
    template: ${CACHE_ROOT}/packages
  - name: manifestsDir
    template: ${CACHE_ROOT}/manifests
mergeStrategy: codex-toml
ownedStateFile: ${HOME}/.config/agent-governance/state/${MACHINE_ID}/codex.json
profileMode: managed
notes:
  - Codex discovers governed and personal user skills directly from ~/.agents/skills.
  - ~/.codex/skills is reserved for Codex-managed system skills; no user-skill mirror is generated there.
  - Governed plugin and MCP entries are merged into ~/.codex/config.toml.
  - Non-governed model and reasoning settings remain untouched.

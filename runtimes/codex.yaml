runtimeId: codex
supportedAssetKinds:
  - skill
  - plugin
  - mcp
enabledCapabilities:
  - mcp.figma
  - plugin.figma
  - skill.playwright-best-practices
  - skill.playwright-cli
  - skill.prisma-performance
  - skill.product-manager-toolkit
  - skill.receiving-code-review
  - skill.requesting-code-review
  - skill.skill-creator
  - skill.tailwindcss-advanced-layouts
  - skill.testing-quality
  - skill.typescript-advanced-types
  - skill.ui-ux-pro-max
  - skill.web-design-guidelines
  - skill.writing-plans
bindingPolicy:
  defaults:
    skill:
      - cache
      - user-dir
    mcp:
      - remote-http
      - stdio-command
    plugin:
      - package
      - external
      - marketplace
  overrides: {}
nativeFiles:
  - name: config
    template: ${HOME}/.codex/config.toml
cacheBindings:
  - name: skillsDir
    template: ${CACHE_ROOT}/skills
  - name: packagesDir
    template: ${CACHE_ROOT}/packages
  - name: manifestsDir
    template: ${CACHE_ROOT}/manifests
mergeStrategy: codex-toml
ownedStateFile: ${HOME}/.config/agent-governance/state/${MACHINE_ID}/codex.json
profileMode: managed
notes:
  - Shared skills live in the shared artifact cache at ~/.agents/skills.
  - Only governed plugin and MCP entries are merged into ~/.codex/config.toml.
  - Non-governed model and reasoning settings remain untouched.

runtimeId: codex
supportedAssetKinds:
  - skill
  - plugin
  - mcp
enabledCapabilities:
  - plugin.openai-curated.build-web-apps
  - plugin.openai-curated.superpowers
bindingPolicy:
  defaults:
    skill:
      - user-dir
      - cache
    mcp:
      - remote-http
      - stdio-command
    plugin:
      - package
      - external
      - marketplace
  overrides: {}
nativeFiles:
  - name: config
    template: ${HOME}/.codex/config.toml
  - name: userSkillsDir
    template: ${HOME}/.codex/skills
cacheBindings:
  - name: skillsDir
    template: ${CACHE_ROOT}/skills
  - name: packagesDir
    template: ${CACHE_ROOT}/packages
  - name: manifestsDir
    template: ${CACHE_ROOT}/manifests
mergeStrategy: codex-toml
ownedStateFile: ${HOME}/.config/agent-governance/state/${MACHINE_ID}/codex.json
profileMode: managed
notes:
  - Shared skills live in the shared artifact cache at ~/.agents/skills.
  - Governed Codex user skills sync into ~/.codex/skills.
  - Governed plugin and MCP entries are merged into ~/.codex/config.toml.
  - Non-governed model and reasoning settings remain untouched.

scenarios:
  - id: clone-is-direct-command
    prompt: Clone https://github.com/visonalhal/agent-governance and run it.
    expectedSkills: []
    forbiddenSkills:
      - skill.intent-routing
      - skill.systematic-debugging-lite
      - skill.implementation-plan-lite

  - id: config-governance-uses-only-governance-skill
    prompt: $agent-governance Compare our Codex plugin config with the workspace skills registry.
    expectedSkills:
      - skill.agent-governance
    forbiddenSkills:
      - skill.intent-routing
      - skill.systematic-debugging-lite

  - id: flaky-test-uses-domain-skill-only
    prompt: This Playwright test is flaky in CI; find the root cause.
    expectedSkills:
      - skill.playwright-best-practices
    forbiddenSkills:
      - skill.intent-routing
      - skill.systematic-debugging-lite
      - skill.risk-based-tdd

  - id: regression-uses-native-codex-workflow
    prompt: Fix this auth regression and make sure it cannot come back.
    expectedSkills: []
    forbiddenSkills:
      - skill.intent-routing
      - skill.risk-based-tdd
      - skill.unit-test-design
      - skill.verification-before-completion-lite
      - skill.brainstorming-lite

  - id: migration-uses-native-plan-and-goal
    prompt: This migration touches three services and needs milestones, evidence, rollout, and rollback gates.
    expectedSkills: []
    forbiddenSkills:
      - skill.intent-routing
      - skill.implementation-plan-lite
      - skill.long-task-planning
      - skill.systematic-debugging-lite

  - id: global-skill-governance-needs-agent-governance
    prompt: $agent-governance Globalize this workflow as a skill, define project opt-in rules, and prevent trigger drift.
    expectedSkills:
      - skill.agent-governance
    forbiddenSkills:
      - skill.intent-routing
      - skill.systematic-debugging-lite

  - id: prompt-template-design-needs-prompt-master
    prompt: Help me design a reusable prompt template for travel planning and include trigger and anti-trigger examples.
    expectedSkills:
      - skill.prompt-master
    forbiddenSkills:
      - skill.intent-routing
      - skill.agent-governance
      - skill.systematic-debugging-lite

  - id: domain-task-is-not-prompt-master
    prompt: Help me plan a 7 day Tokyo family trip with a 20000 RMB budget.
    expectedSkills: []
    forbiddenSkills:
      - skill.intent-routing
      - skill.prompt-master
      - skill.agent-governance

  - id: zh-simple-answer-does-not-trigger-meta-workflows
    prompt: 用三句话解释为什么索引能加快数据库查询。
    expectedSkills: []
    forbiddenSkills:
      - skill.agent-governance
      - skill.skill-audit
      - skill.prompt-master
      - skill.playwright-best-practices

  - id: zh-diagnosis-does-not-trigger-governance
    prompt: 只诊断这个 Node 服务为什么启动失败，不要修改文件。
    expectedSkills: []
    forbiddenSkills:
      - skill.agent-governance
      - skill.skill-audit
      - skill.prompt-master

  - id: zh-implementation-uses-native-workflow
    prompt: 修复登录按钮无响应的问题，完成后运行相关测试。
    expectedSkills: []
    forbiddenSkills:
      - skill.agent-governance
      - skill.skill-audit
      - skill.prompt-master
      - skill.intent-routing

  - id: zh-long-migration-does-not-trigger-meta-skills
    prompt: 这个迁移跨三个服务，需要里程碑、证据、灰度和回滚门禁。
    expectedSkills: []
    forbiddenSkills:
      - skill.agent-governance
      - skill.skill-audit
      - skill.prompt-master
      - skill.long-task-planning

  - id: zh-explicit-governance-invocation
    prompt: $agent-governance 审计当前全局 skills、项目 opt-in 和触发漂移。
    expectedSkills:
      - skill.agent-governance
    forbiddenSkills:
      - skill.skill-audit
      - skill.prompt-master

  - id: zh-prompt-audit-uses-prompt-master-only
    prompt: 审计这段 system prompt，压缩重复规则并补充 trigger 和 anti-trigger 示例。
    expectedSkills:
      - skill.prompt-master
    forbiddenSkills:
      - skill.agent-governance
      - skill.skill-audit
